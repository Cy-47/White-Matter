name: CPU validation
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: 4
      MKL_NUM_THREADS: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch==2.12.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install '.[models,training,dev]' transformers==5.10.2
      - run: ruff check src training evals examples benchmarks tests scripts studies
      - run: mypy
      - run: pytest -m 'not gpu'
      - run: python -m build
      - run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - run: python -m training.train --help && python -m evals.heldout --help
      - run: python scripts/check_wheel.py dist/*.whl
      - run: cd /tmp && python -c 'from white_matter.ops import cyclic_attention; from white_matter.blocks import WhiteMatterBlock; from white_matter.models import register_models; register_models()'
      - run: cd /tmp && mypy --follow-imports=silent --warn-unused-ignores "$GITHUB_WORKSPACE/tests/typing/contracts.py"
